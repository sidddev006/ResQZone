services:
  # Backend FastAPI Web Service on Render
  - type: web
    name: resqzone-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python -m backend.app.db.seed && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: PYTHONPATH
        value: .
      - key: DATA_MODE
        value: DEMO
      - key: GEMINI_API_KEY
        sync: false
      - key: CARTO_API_KEY
        value: cb1_3qdu_1_b6e83ebd02b8fc33637fe5ff
      - key: MAPBOX_TOKEN
        sync: false

