<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#bgDark)" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- Geometric Hexagonal Zone -->
  <path d="M16 5 L26 10.5 V21.5 L16 27 L6 21.5 V10.5 Z" fill="url(#primaryGrad)" fill-opacity="0.2" stroke="url(#primaryGrad)" stroke-width="1.5"/>

  <!-- Rescue Cross Core -->
  <path d="M14 10 H18 V14 H22 V18 H18 V22 H14 V18 H10 V14 H14 Z" fill="#FFFFFF" filter="url(#shadow)"/>

  <!-- Live Threat Beacon Indicator -->
  <circle cx="24" cy="8" r="3" fill="url(#accentGrad)"/>
  <circle cx="24" cy="8" r="4.5" stroke="#EF4444" stroke-width="1" stroke-opacity="0.6"/>
</svg>
